version: 2

project_name: textanchor

builds:
  - id: textanchor
    main: ./cmd/textanchor
    binary: textanchor
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, README.md, docs/bundle-format.md]

checksum:
  name_template: checksums.txt

changelog:
  use: github
